<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GK Powe Dose — Admin Control Center</title><style>:root{--n:#0b2b55;--b:#1877e8;--bg:#edf5fc;--c:#fff;--t:#132a47;--m:#71839a;--l:#d7e3ee;--d:#d33b3b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;color:var(--t);background:radial-gradient(circle at 10% 0,#fff,#edf5fc 55%,#e4eef7);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;box-shadow:inset 0 2px 1px #fff,0 7px 0 #c7d8e7,0 16px 35px #12375d18}.login .card{width:min(430px,100%);padding:30px}.logo{width:54px;height:54px;border-radius:17px;background:#fff;color:var(--n);display:grid;place-items:center;font-weight:950;font-size:18px;box-shadow:inset 0 2px 2px #fff,0 5px 0 #b8ccdf,0 9px 18px #061f4030}.login h1{text-align:center;margin:15px 0 4px}.sub{text-align:center;color:var(--m);margin:0 0 22px}label{font-size:12px;font-weight:850;display:block;margin:10px 0 5px}input,textarea,select{width:100%;border:1px solid var(--l);border-radius:13px;padding:12px;background:#fff;color:var(--t);outline:none;box-shadow:inset 0 2px 5px #12375d0a,0 2px 0 #fff}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#67a8e8;box-shadow:0 0 0 3px #1877e81a,inset 0 2px 5px #12375d0a}.primary,.ghost,.danger,.logout{border:0;border-radius:12px;padding:11px 15px;font-weight:850;transition:.15s}.primary{background:linear-gradient(145deg,#2188f2,#0964c9);color:#fff;box-shadow:inset 0 2px 2px #ffffff35,0 4px 0 #0752a5,0 8px 15px #0752a526}.ghost{background:#fff;color:var(--t);border:1px solid var(--l);box-shadow:inset 0 2px 1px #fff,0 3px 0 #c5d5e4}.danger{background:#fff0f0;color:var(--d);box-shadow:inset 0 2px 1px #fff,0 3px 0 #e2baba}.primary:active,.ghost:active,.danger:active,.logout:active{transform:translateY(3px)}.top{position:sticky;top:0;z-index:20;height:74px;padding:0 16px;display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(145deg,#153d72,#08264c);box-shadow:0 5px 0 #061e3c,0 12px 28px #09275030}.top .logo{width:45px;height:45px}.brand b{display:block;font-size:17px}.brand small{opacity:.7}.spacer{flex:1}.logout{color:#fff;background:#ffffff16;border:1px solid #ffffff35;box-shadow:inset 0 1px #ffffff20,0 4px 0 #061e3c}.wrap{max-width:1180px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border-radius:17px;background:linear-gradient(145deg,#f8fbff,#e8f2fc);box-shadow:inset 0 2px 2px #fff,0 5px 0 #c6d8e8,0 10px 20px #12375d12}.stat small{display:block;color:var(--m)}.stat b{font-size:30px}.tabs{display:flex;gap:9px;overflow:auto;padding:8px 2px 15px}.tab{white-space:nowrap}.tab.active{background:linear-gradient(145deg,#153e75,#092951);color:#fff;border-color:#092951;box-shadow:inset 0 2px 2px #ffffff25,0 4px 0 #061e3c,0 8px 15px #071e3e30}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}.title{font-weight:850}.meta,.muted{color:var(--m);font-size:12px}.actions{display:flex;gap:7px;align-items:center}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-top:8px;background:#eef3f8}.msg{font-size:13px;margin-top:9px}.ok{color:#13845b}.err{color:var(--d)}h2{margin:0 0 10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:11px}.row{display:block}.actions{margin-top:9px}.toolbar{flex-wrap:wrap}.top{padding:0 10px}.login .card{padding:24px}}
</style></head><body><div id="login" class="login"><div class="card"><div class="logo" style="margin:auto">GK</div><h1>GK Powe Dose Admin</h1><p class="sub">Questions • Subjects • Banners • Notifications</p><label>Admin Gmail</label><input id="email" type="email" placeholder="admin@gmail.com"><label>Password</label><input id="pass" type="password" placeholder="Password"><button id="loginBtn" class="primary" style="width:100%;margin-top:14px">🔐 Login</button><div id="loginMsg" class="msg"></div><div id="conn" class="muted" style="text-align:center;margin-top:10px">Checking connection…</div></div></div><div id="app" class="hidden"><header class="top"><div class="logo">GK</div><div class="brand"><b>GK Powe Dose</b><small>ADMIN CONTROL CENTER</small></div><div class="spacer"></div><button id="logout" class="logout">🚪 Logout</button></header><main class="wrap"><div class="stats"><div class="stat"><small>Total Questions</small><b id="tq">0</b></div><div class="stat"><small>Subjects</small><b id="ts">0</b></div><div class="stat"><small>Banners</small><b id="tb">0</b></div><div class="stat"><small>Notifications</small><b id="tn">0</b></div></div><div class="tabs"><button class="tab active" data-x="questions">📝 Questions</button><button class="tab" data-x="subjects">📚 Subjects</button><button class="tab" data-x="banners">🖼️ Banners</button><button class="tab" data-x="notifications">🔔 Notifications</button></div><section id="questions" class="page"><div class="card"><h2>➕ Add Question</h2><form id="qf"><div class="grid"><div class="full"><label>Question</label><textarea id="q" required></textarea></div><div><label>Option A</label><input id="a" required></div><div><label>Option B</label><input id="b" required></div><div><label>Option C</label><input id="c" required></div><div><label>Option D</label><input id="d" required></div><div><label>Correct Answer</label><select id="ca"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div><label>Subject</label><select id="cat"></select></div><div><label>Difficulty</label><select id="diff"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div><div class="full"><label>Explanation</label><textarea id="ex"></textarea></div></div><button class="primary" style="margin-top:12px">💾 Save Question</button><div id="qm" class="msg"></div></form></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search questions…"><button class="ghost" id="qr">↻ Refresh</button></div><div id="ql"></div></div></section><section id="subjects" class="page hidden"><div class="card"><h2>➕ Create New Subject Button</h2><form id="sf"><div class="grid"><div><label>Subject Name</label><input id="sn" required placeholder="Current Affairs"></div><div><label>Icon / Emoji</label><input id="si" value="📚"></div><div><label>Description</label><input id="sd" placeholder="Current Affairs Quiz"></div><div><label>Sort Order</label><input id="so" type="number" value="9"></div><div><label>Status</label><select id="sa"><option value="true">Active</option><option value="false">Inactive</option></select></div></div><button class="primary" style="margin-top:12px">💾 Save Subject</button><div id="sm" class="msg"></div></form></div><div class="card"><div class="sectionhead"><h2>📚 Subject Manager</h2><button class="ghost" id="sr">↻ Refresh</button></div><div id="sl"></div></div></section><section id="banners" class="page hidden"><div class="card"><h2>➕ Add Banner</h2><form id="bf"><label>Banner Image URL (16:9)</label><input id="bu" type="url" required placeholder="https://…/banner.jpg"><label>Banner Title</label><input id="bt" placeholder="UPSC Special"><div class="grid"><div><label>Sort Order</label><input id="bo" type="number" value="0"></div><div><label>Status</label><select id="ba"><option value="true">Active</option><option value="false">Inactive</option></select></div></div><button class="primary" style="margin-top:12px">💾 Save Banner</button><div id="bm" class="msg"></div></form></div><div class="card"><div id="bl"></div></div></section><section id="notifications" class="page hidden"><div class="card"><h2>➕ Add Notification</h2><form id="nf"><label>Title</label><input id="nt" placeholder="Important Update"><label>Notification Message</label><textarea id="nm" required placeholder="Write update…"></textarea><label>Status</label><select id="na"><option value="true">Active</option><option value="false">Inactive</option></select><button class="primary" style="margin-top:12px">🔔 Save Notification</button><div id="nn" class="msg"></div></form></div><div class="card"><div id="nl"></div></div></section></main></div><script>const U='https://ugvwjmrypfzlkvgdlyyd.supabase.co',K='sb_publishable_hkeKErApW_v67irPbJMrvQ_q41MHDue',A=U+'/rest/v1';let token=localStorage.getItem('gk_access_token')||'',me=null,qs=[],ss=[],bs=[],ns=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function hdr(){return{'apikey':K,'Authorization':'Bearer '+(token||K),'Content-Type':'application/json'}}async function api(p,o={}){let r=await fetch(A+p,{...o,headers:{...hdr(),...(o.headers||{})}}),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d={message:t}}if(!r.ok)throw Error(d.message||d.error_description||t||'Request failed');return d}function say(id,t,ok=false){$(id).innerHTML=t?`<span class="${ok?'ok':'err'}">${esc(t)}</span>`:''}async function login(){let e=$('email').value.trim(),p=$('pass').value;if(!e||!p)return say('loginMsg','Enter Gmail and password.');$('loginBtn').disabled=true;$('loginBtn').textContent='Logging in…';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Login failed');token=d.access_token;me=d.user;localStorage.setItem('gk_access_token',token);let ad=await api('/admins?select=user_id&user_id=eq.'+me.id+'&limit=1');if(!ad.length)throw Error('This Gmail is not in the Admin list.');$('login').classList.add('hidden');$('app').classList.remove('hidden');await all()}catch(e){token='';localStorage.removeItem('gk_access_token');say('loginMsg',e.message)}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='🔐 Login'}}$('loginBtn').onclick=login;$('pass').onkeydown=e=>e.key==='Enter'&&login();async function all(){await Promise.all([loadQ(),loadS(),loadB(),loadN()])}async function loadQ(){qs=await api('/questions?select=*&order=id.desc')||[];$('tq').textContent=qs.length;fillCat();renderQ()}function fillCat(){let names=ss.length?ss.map(x=>x.name):['History','Polity','Economy','Geography','Art & Culture','Disaster Management','General Science','Technology'];$('cat').innerHTML=names.map(x=>`<option>${esc(x)}</option>`).join('')}function renderQ(){let z=$('search').value.toLowerCase();$('ql').innerHTML=qs.filter(x=>String(x.question).toLowerCase().includes(z)).map(x=>`<div class="row"><div><div class="title">${esc(x.question)}</div><div class="meta">${esc(x.category)} • Correct: ${['A','B','C','D'][x.correct_answer]||'?'} • ${esc(x.difficulty||'Medium')}</div></div><div class="actions"><button class="danger" onclick="delQ(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No questions found.</p>'}window.delQ=async id=>{if(!confirm('Delete this question?'))return;await api('/questions?id=eq.'+id,{method:'DELETE'});loadQ()};$('search').oninput=renderQ;$('qr').onclick=loadQ;$('qf').onsubmit=async e=>{e.preventDefault();try{await api('/questions',{method:'POST',body:JSON.stringify({question:$('q').value.trim(),option_a:$('a').value.trim(),option_b:$('b').value.trim(),option_c:$('c').value.trim(),option_d:$('d').value.trim(),correct_answer:+$('ca').value,category:$('cat').value,difficulty:$('diff').value,explanation:$('ex').value.trim()})});say('qm','Question added successfully.',true);e.target.reset();$('diff').value='Medium';await loadQ()}catch(e){say('qm',e.message)}};async function loadS(){try{ss=await api('/subjects?select=*&order=sort_order.asc,name.asc')||[];$('ts').textContent=ss.length;fillCat();$('sl').innerHTML=ss.map(s=>`<div class="row"><div><div class="title">${esc(s.icon||'📚')} ${esc(s.name)}</div><div class="meta">${s.active?'Active':'Inactive'} • Order ${s.sort_order||0}</div><div class="muted">${esc(s.description||'')}</div></div><div class="actions"><button class="danger" onclick="delS(${s.id})">Delete</button></div></div>`).join('')||'<p class="muted">No subjects yet.</p>'}catch(e){$('sl').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}window.delS=async id=>{if(!confirm('Delete this subject?'))return;await api('/subjects?id=eq.'+id,{method:'DELETE'});loadS()};$('sr').onclick=loadS;$('sf').onsubmit=async e=>{e.preventDefault();try{await api('/subjects',{method:'POST',body:JSON.stringify({name:$('sn').value.trim(),icon:$('si').value.trim()||'📚',description:$('sd').value.trim(),sort_order:+$('so').value||0,active:$('sa').value==='true'})});say('sm','New subject button created.',true);e.target.reset();$('si').value='📚';await loadS()}catch(e){say('sm',e.message)}};async function loadB(){bs=await api('/banners?select=*&order=sort_order.asc,created_at.desc')||[];$('tb').textContent=bs.length;$('bl').innerHTML=bs.map(b=>`<div class="row"><div style="flex:1"><div class="title">${esc(b.title||'Banner')}</div><div class="meta">${b.active?'Active':'Inactive'}</div><img class="preview" src="${esc(b.image_url)}"></div><div class="actions"><button class="danger" onclick="delB(${b.id})">Delete</button></div></div>`).join('')||'<p class="muted">No banners yet.</p>'}window.delB=async id=>{if(!confirm('Delete banner?'))return;await api('/banners?id=eq.'+id,{method:'DELETE'});loadB()};$('bf').onsubmit=async e=>{e.preventDefault();try{await api('/banners',{method:'POST',body:JSON.stringify({title:$('bt').value.trim(),image_url:$('bu').value.trim(),sort_order:+$('bo').value||0,active:$('ba').value==='true'})});say('bm','Banner added.',true);e.target.reset();$('bo').value=0;await loadB()}catch(e){say('bm',e.message)}};async function loadN(){ns=await api('/notifications?select=*&order=created_at.desc')||[];$('tn').textContent=ns.length;$('nl').innerHTML=ns.map(n=>`<div class="row"><div><div class="title">${esc(n.title||'Notification')}</div><div class="meta">${n.active?'Active':'Inactive'}</div><div>${esc(n.message)}</div></div><div class="actions"><button class="danger" onclick="delN(${n.id})">Delete</button></div></div>`).join('')||'<p class="muted">No notifications yet.</p>'}window.delN=async id=>{if(!confirm('Delete notification?'))return;await api('/notifications?id=eq.'+id,{method:'DELETE'});loadN()};$('nf').onsubmit=async e=>{e.preventDefault();try{await api('/notifications',{method:'POST',body:JSON.stringify({title:$('nt').value.trim(),message:$('nm').value.trim(),active:$('na').value==='true'})});say('nn','Notification added.',true);e.target.reset();await loadN()}catch(e){say('nn',e.message)}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.x).classList.remove('hidden')});$('logout').onclick=()=>{localStorage.removeItem('gk_access_token');location.reload()};(async()=>{try{let r=await fetch(A+'/questions?select=id&limit=1',{headers:{apikey:K}});$('conn').textContent=r.ok?'Supabase connected ✓':'Supabase connection problem'}catch{$('conn').textContent='Internet/connection problem'}})();</script></body></html>
